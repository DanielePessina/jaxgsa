<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved choice before paint; otherwise follow the device theme.
      try {
        const savedTheme = localStorage.getItem("jaxgsa-theme");
        const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle(
          "dark",
          savedTheme === "dark" || (savedTheme !== "light" && prefersDark),
        );
      } catch {
        document.documentElement.classList.toggle(
          "dark",
          matchMedia("(prefers-color-scheme: dark)").matches,
        );
      }
    </script>
    <title>jaxgsa — sensitivity analysis in your browser</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
