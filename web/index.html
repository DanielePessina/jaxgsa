<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Run jaxgsa global sensitivity analysis in your browser, compiled to WebAssembly. Pick a method, draw samples, and read the indices without installing Python."
    />
    <link rel="canonical" href="https://danielepessina.github.io/jaxgsa/workbench/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="jaxgsa" />
    <meta property="og:title" content="jaxgsa workbench — sensitivity analysis in your browser" />
    <meta
      property="og:description"
      content="Run jaxgsa global sensitivity analysis in your browser, compiled to WebAssembly. No Python install required."
    />
    <meta property="og:url" content="https://danielepessina.github.io/jaxgsa/workbench/" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Apply the saved choice before paint; otherwise follow the device theme.
      try {
        const savedTheme = localStorage.getItem("jaxgsa-theme");
        const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle(
          "dark",
          savedTheme === "dark" || (savedTheme !== "light" && prefersDark),
        );
      } catch {
        document.documentElement.classList.toggle(
          "dark",
          matchMedia("(prefers-color-scheme: dark)").matches,
        );
      }
    </script>
    <title>jaxgsa — sensitivity analysis in your browser</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
