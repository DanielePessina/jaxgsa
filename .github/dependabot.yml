version: 2
updates:
  # Keep the GitHub Actions used by CI / publish workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Keep the locked Python dependencies (uv.lock) current. Grouped into a
  # single weekly PR to minimise noise; these are lockfile/dev pins, not the
  # public version floors declared in pyproject.toml.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]
