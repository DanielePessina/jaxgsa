name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # 03:17 UTC daily, for the `slow` tests that pytest deselects by default.
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project and dev dependencies
        run: uv sync --extra dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check src/jaxgsa

      - name: Run tests
        run: uv run pytest -q

  # The same suite in double precision.
  #
  # jaxgsa ships no x64 wrapper and sets no flag: it computes in whatever
  # precision JAX is configured for. Both settings are therefore supported
  # configurations, and only one of them was ever run. The
  # difference is not cosmetic — a warning that correctly fires only in
  # float32, a clip bound that only bites in float64, a dtype-dependent
  # tolerance — and ten tests had quietly accumulated a float32 assumption by
  # the time anyone ran the suite with the flag on.
  #
  # One Python version, not the matrix: this job asks about a JAX flag, and
  # nothing about it varies with the interpreter.
  x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install project and dev dependencies
        run: uv sync --extra dev

      - name: Run tests in double precision
        env:
          JAX_ENABLE_X64: "1"
        run: uv run pytest -q

  # The fixed-seed numerical baseline. Separate from `test` so a multi-minute
  # numerical dump stays out of local `pytest -q`, and so a moved number
  # reports as its own failure rather than one more red test.
  #
  # Every pre-existing entry must stay bit-identical; any movement is a defect
  # until it is proved otherwise. Until this job existed that rule was
  # enforced by whoever remembered to run the script, which is how the
  # stored file stayed pinned at 0.8.0.
  #
  # This job does NOT compare against the stored file. That file records
  # float32 results to the last bit and those bits depend on the CPU: a dump
  # made on Apple silicon differs from one made on x86-64 in about a thousand
  # values, by 1e-5 to 1e-7, with no code change involved. Instead it dumps
  # the base commit and the head commit on this one runner and diffs those.
  # Same machine on both sides, so no tolerance is needed, and it answers the
  # question a pull request actually raises: did this change move a number.
  #
  # Each commit is dumped with its own copy of the dump script, which is what
  # we want: a deliberate change to the recorded schema shows up as a schema
  # difference rather than a crash.
  baseline:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Dump the base commit
        id: base
        run: |
          git checkout --detach ${{ github.event.pull_request.base.sha }}
          if [ ! -f scripts/baseline_dump.py ]; then
            echo "The base commit has no baseline harness; nothing to compare."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv sync --extra dev
          uv run python scripts/baseline_dump.py --out /tmp/base.json --quiet

      - name: Dump this commit
        if: steps.base.outputs.skip != 'true'
        run: |
          git checkout --detach ${{ github.event.pull_request.head.sha }}
          uv sync --extra dev
          uv run python scripts/baseline_dump.py --out /tmp/head.json --quiet

      # --allow-schema-change: this job asks whether the change moved a
      # number. A result that gains or loses a field is a deliberate edit to
      # the public surface, reviewed in the diff like any other, and it must
      # not read as a numerical regression. Moved values still fail.
      - name: Compare the two dumps
        if: steps.base.outputs.skip != 'true'
        run: |
          uv run python scripts/baseline_check.py \
            --baseline /tmp/base.json --current /tmp/head.json \
            --allow-schema-change

  # There is deliberately no job that diffs the tracked
  # `scripts/baseline/baseline-1.0.0.json` against a fresh dump. One existed
  # and could never pass: float32 XLA output is not reproducible across
  # machines, so a file produced on a maintainer's Mac differs from any runner
  # by 1e-11 to 1e-7 on hundreds of values with no code change involved, and
  # `baseline_check.py` has no tolerance on purpose. The job above catches what
  # matters, which is a number this PR moved, by dumping both sides on one
  # runner. Whether the stored file still matches the code is checked by hand
  # when it is regenerated: see `scripts/baseline/README.md`.

  # The joint-mode optimal-transport tests that run every Sinkhorn solve at
  # full sample size. `addopts = "-m 'not slow'"` in pyproject.toml keeps them
  # out of every ordinary run, because together they cost more than the rest
  # of the suite. They still have to run somewhere, so they run here: nightly,
  # and on demand through workflow_dispatch.
  slow-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install project and dev dependencies
        run: uv sync --extra dev

      - name: Run the deselected slow tests
        run: uv run pytest -m slow -v
