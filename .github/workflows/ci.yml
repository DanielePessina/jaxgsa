name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # 03:17 UTC daily, for the `slow` tests that pytest deselects by default.
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the pull-request gate small and explicit: this exercises one public
  # analyze path for every registered method without running the long-form
  # numerical/oracle suite.
  method-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project and dev dependencies
        run: uv sync --extra dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check src/jaxgsa

      - name: Run tests
        run: uv run pytest -q tests/test_feature_matrix.py tests/test_registry.py tests/test_imports.py

  # The same package-only matrix in double precision.
  #
  # jaxgsa ships no x64 wrapper and sets no flag: it computes in whatever
  # precision JAX is configured for. Both settings are therefore supported
  # configurations. The matrix includes precision-sensitive method paths, so
  # both supported settings stay covered without replaying the full suite.
  #
  # One Python version, not the matrix: this job asks about a JAX flag, and
  # nothing about it varies with the interpreter.
  method-matrix-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install project and dev dependencies
        run: uv sync --extra dev

      - name: Run tests in double precision
        env:
          JAX_ENABLE_X64: "1"
        run: uv run pytest -q tests/test_feature_matrix.py tests/test_registry.py tests/test_imports.py

  # The joint-mode optimal-transport tests that run every Sinkhorn solve at
  # full sample size. `addopts = "-m 'not slow'"` in pyproject.toml keeps them
  # out of every ordinary run, because together they cost more than the rest
  # of the suite. They still have to run somewhere, so they run here: nightly,
  # and on demand through workflow_dispatch.
  slow-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install project and dev dependencies
        run: uv sync --extra dev

      - name: Run the deselected slow tests
        run: uv run pytest -m slow -v
