name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # 03:17 UTC daily, for the numerical regression suite and slow tests.
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast smoke gate: one public analyze path for every registered method. The
  # full default suite runs in numerical-tests below, on every pull request.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project and dev dependencies
        run: uv sync --locked --extra dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check src/jaxgsa

      - name: Run tests
        run: uv run pytest -q tests/test_feature_matrix.py tests/test_registry.py tests/test_imports.py

  # The same package-only matrix in double precision.
  #
  # jaxgsa ships no x64 wrapper and sets no flag: it computes in whatever
  # precision JAX is configured for. Both settings are therefore supported
  # configurations. The matrix includes precision-sensitive method paths, so
  # both supported settings stay covered without replaying the full suite.
  #
  # One Python version, not the matrix: this job asks about a JAX flag, and
  # nothing about it varies with the interpreter.
  x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install project and dev dependencies
        run: uv sync --locked --extra dev

      - name: Run tests in double precision
        env:
          JAX_ENABLE_X64: "1"
        run: uv run pytest -q tests/test_feature_matrix.py tests/test_registry.py tests/test_imports.py

  # The whole default tier (`-m 'not slow'`), in float32 and float64. It takes
  # a few minutes with pytest-xdist, so it gates every pull request.
  numerical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        x64: ["0", "1"]
    env:
      JAX_ENABLE_X64: ${{ matrix.x64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install project and dev dependencies
        run: uv sync --locked --extra dev
      - name: Run all ordinary numerical regressions
        run: uv run pytest -m "not slow" -q -n auto

  # The oracle and convergence tests at full sample size (SALib, POT and
  # closed-form references). `addopts = "-m 'not slow'"` in pyproject.toml
  # keeps them out of every ordinary run, because together they cost more than
  # the rest of the suite. Each has a cheap default-tier counterpart. They run
  # here: nightly, on demand through workflow_dispatch, and before publishing.
  slow-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install project and dev dependencies
        run: uv sync --locked --extra dev

      - name: Run the deselected slow tests
        run: uv run pytest -m slow -v -n auto

  # Browser app in web/: lint, types, unit tests and a production build.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install the browser for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Run the end-to-end tests
        run: npm run test:e2e
      - name: Upload the end-to-end report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/e2e/playwright-report
            web/e2e/test-results
          retention-days: 7
