# Publishes jaxgsa to PyPI when a GitHub Release is published.
#
# Setup required once on PyPI (no API tokens needed):
#   PyPI project -> Settings -> Publishing -> add a "trusted publisher" for
#   owner=DanielePessina, repo=jaxgsa, workflow=publish.yml, environment=pypi.
# See https://docs.pypi.org/trusted-publishers/
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jaxgsa
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
