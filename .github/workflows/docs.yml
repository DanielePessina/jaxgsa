name: Deploy docs and WASM workbench to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "web/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
        working-directory: docs
      - run: npm run docs:check
        working-directory: docs
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_BASE: /jaxgsa/workbench/
      - name: Add the browser workbench to the Pages artifact
        run: |
          mkdir -p docs/.vitepress/dist/workbench
          cp -R web/dist/. docs/.vitepress/dist/workbench/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
